<style>body{margin:0;background:#07111f;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh;display:grid;place-items:center}.box{text-align:center;max-width:680px;padding:32px}.logo{width:64px;height:64px;margin:auto;border-radius:20px;background:linear-gradient(135deg,#3ee7d2,#46a5ff);display:grid;place-items:center;color:#051421;font-weight:900;font-size:24px}.muted{color:#9fb0c7}.choices{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:26px}.choices a{color:#fff;text-decoration:none;padding:13px 19px;border:1px solid rgba(255,255,255,.16);border-radius:14px;font-weight:800}.choices a:first-child{background:#10253e}.choices a:last-child{background:linear-gradient(135deg,#3ee7d2,#46a5ff);color:#061421;border:0}</style>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
</head><body><main class="box"><div class="logo">FI</div><h1>Faizal Infotech</h1><p class="muted">Selecting the best language for your region…<br>جارٍ اختيار اللغة الأنسب لمنطقتك…</p><div class="choices"><a href="en/" onclick="save('en')">English</a><a href="ar/" onclick="save('ar')">العربية</a></div></main>
<script>
function save(v){try{localStorage.setItem('siteLanguage',v)}catch(e){}}
(function(){
  let saved=null; try{saved=localStorage.getItem('siteLanguage')}catch(e){}
  if(saved==='en'||saved==='ar'){ location.replace(saved+'/'); return; }
  const langs=(navigator.languages||[navigator.language||'']).join(',').toLowerCase();
  let tz=''; try{tz=Intl.DateTimeFormat().resolvedOptions().timeZone||''}catch(e){}
  let lang='en';
  if(tz==='Asia/Riyadh' || /(^|,)ar([_-]|,|$)/.test(langs)) lang='ar';
  if(tz==='Asia/Kolkata' && !/(^|,)ar([_-]|,|$)/.test(langs)) lang='en';
  setTimeout(()=>location.replace(lang+'/'),350);
})();
</script></body></html>
